name: DNSx smoke

on:
  push:
    branches: [main]
    paths:
      - "modules/subdomain.py"
      - "modules/provider_compatibility*"
      - "tests/fixtures/dns_server.py"
      - "scripts/check_dnsx.py"
      - "scripts/provider_updates.py"
      - ".github/workflows/dnsx-smoke.yml"
  pull_request:
    paths:
      - "modules/subdomain.py"
      - "modules/provider_compatibility*"
      - "tests/fixtures/dns_server.py"
      - "scripts/check_dnsx.py"
      - "scripts/provider_updates.py"
      - ".github/workflows/dnsx-smoke.yml"
  workflow_dispatch:

jobs:
  dnsx-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install registry baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "from modules.provider_compatibility import PROVIDERS; print(PROVIDERS['dnsx']['baseline'])")
          python scripts/provider_updates.py install dnsx "$version" --destination "$RUNNER_TEMP/dnsx-bin"
          echo "$RUNNER_TEMP/dnsx-bin" >> "$GITHUB_PATH"

      - name: Run DNSx smoke check
        run: python scripts/check_dnsx.py
